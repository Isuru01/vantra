version: "3.8"

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      MONGO_URI: mongodb://mongo:27017/vantra
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ALERTING_SERVICE_URL: http://alerting:3001
      ALERTING_SERVICE_TOKEN: ${ALERTING_SERVICE_TOKEN:?Set ALERTING_SERVICE_TOKEN in .env}
    depends_on:
      mongo:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  alerting:
    build:
      context: ./alerting-service
    ports:
      - "3001:3001"
    environment:
      MONGO_URI: mongodb://mongo:27017/vantra
      PORT: 3001
      ALERTING_SERVICE_TOKEN: ${ALERTING_SERVICE_TOKEN:?Set ALERTING_SERVICE_TOKEN in .env}
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    # Reserved for dashboard caching work - not yet used by the app.

volumes:
  mongo_data:
